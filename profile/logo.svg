<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="108" fill="#0B0B0D"/>
  <!-- the never-ending waveform: an unbroken loop that is also a "K" tail -->
  <path d="M104 296
           C 128 216, 160 176, 192 256
           S 256 376, 304 276
           S 376 156, 408 232"
        stroke="#FF8C42" stroke-width="17" fill="none" stroke-linecap="round"/>
  <path d="M104 296 C 128 216, 160 176, 192 256"
        stroke="#FF8C42" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.45"/>
  <circle cx="408" cy="232" r="13" fill="#FF8C42"/>
  <text x="256" y="396" text-anchor="middle"
        font-family="Menlo, monospace" font-size="58" letter-spacing="18"
        fill="#D9D9D9">KONTINUUM</text>
  <text x="256" y="436" text-anchor="middle"
        font-family="Menlo, monospace" font-size="19" letter-spacing="6"
        fill="#7A7A7A">let the music never stop</text>
</svg>
