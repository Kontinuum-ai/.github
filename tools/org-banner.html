<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kontinuum org banner</title>
<style>
  /* The site uses ui-monospace / SF Mono, so no webfont: Chrome resolves the
     same stack here that a visitor's browser resolves on kontinuum.audio. */
  html, body { margin: 0; padding: 0; width: 1280px; height: 440px; overflow: hidden; }
  body {
    background: #0B0B0D; color: #D9D9D9;
    font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
    position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    box-sizing: border-box; padding: 0 80px;
  }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(30% 56% at 26% 30%, rgba(255,59,48,.15), transparent 68%),
      radial-gradient(30% 56% at 74% 30%, rgba(255,159,10,.13), transparent 68%),
      radial-gradient(40% 60% at 50% 118%, rgba(255,90,40,.10), transparent 70%);
  }
  .mark { position: relative; width: 208px; height: 152px; margin-bottom: 14px; }
  .word {
    position: relative; font-size: 42px; font-weight: 600; letter-spacing: .42em;
    line-height: 1; margin: 0; text-indent: .42em; color: #ECEBE6;
  }
  .glyphs { position: relative; color: rgba(255,255,255,.22); letter-spacing: 1.2em; font-size: 13px; margin: 16px 0 0; text-indent: 1.2em; }
  .tag { position: relative; font-size: 15px; letter-spacing: .14em; color: rgba(255,255,255,.42); margin: 16px 0 0; }
  .meta { position: relative; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.22); margin: 26px 0 0; }
  .meta b { color: #FF3B30; font-weight: 400; }
  .rule { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, #FF3B30, #FF6D1D 46%, #FF9F0A); }
</style>
</head>
<body>
  <div class="glow"></div>
  <img class="mark" src="../assets/mark.svg" alt="">
  <p class="word">KONTINUUM</p>
  <p class="glyphs">●&nbsp;•&nbsp;∙&nbsp;·</p>
  <p class="tag">let the music never stop</p>
  <p class="meta">kontinuum.audio &nbsp;&middot;&nbsp; <b>FZ-001</b> &nbsp;&middot;&nbsp; a Factory Zero venture</p>
  <div class="rule"></div>
</body>
</html>
